# Reviewed suppression registry for the Step D6 consistency checks.
#
# One acknowledgement per line:
#
#   - <check-code>[:<detail>] — <reason>
#
# <detail> narrows the line to a single glyph (glyph-unique-in-corpus) or
# notation key; omit it to acknowledge every finding of that code. Silent
# suppression is not available anywhere else — a finding is a violation until a
# reviewer records it here with a reason.
#
# Check codes: glyph-unique-in-corpus, notation-units, units-vocab,
# convention-single-definition, weak-local,
# notation-source-locator, card-wants-demoting, gloss-name-shape.
#
# glyph-unique-in-corpus: since explico 0.14 this fires only when two shared
# cards in content/notation/ claim one glyph. A notation.local entry or a gloss
# that reuses a letter is rule N4's declared exception and is not reported, so
# the fourteen lines that acknowledged such page-local reuse (P, C, F, i, j, k,
# K, m, n, N, q, T, t, x_j) were deleted with the upgrade; validate:content
# reports no glyph-unique-in-corpus finding without them. Where two lessons
# declared the same meaning twice, the entries were merged into one shared card
# instead (default-time, lattice-node-discount-factor, lattice-node-up-weight,
# underlying-income-present-value).
