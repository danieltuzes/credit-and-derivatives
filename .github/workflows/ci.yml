name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A run with no compiled PDFs to restore compiles every one (see below).
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable the pinned pnpm version
        run: corepack enable

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # `astro build` (twice in `pnpm verify`: under the browser tests and at
      # the end) compiles the PDF downloads (`lessonExports.latex`) with
      # LuaLaTeX and latexmk; with CI set, a missing TeX Live fails the build
      # instead of leaving the PDFs out. Same install as deploy.yml: the
      # package list the pinned explico ships, and a named CTAN mirror, since
      # the action's own pick fails with "No mirror available" when it does
      # not answer.
      - name: Install TeX Live for the PDF downloads
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4.3.0
        with:
          texlive_version: 2026
          repository: https://mirrors.mit.edu/CTAN/systems/texlive/tlnet
          package_file: node_modules/explico/src/compiler/exports/latex/texlive-packages.txt

      # The PDFs an earlier run compiled; each build compiles only the ones
      # whose chapter, part or course changed (explico 0.14.0 migration step
      # 13), so the second build reuses all of the first's. Its own key, so it
      # never races deploy.yml's save on a push to main; `restore-keys` reads
      # the newest of either.
      - name: Restore compiled PDFs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/explico-latex
          key: explico-latex-ci-${{ github.sha }}
          restore-keys: explico-latex-

      - name: Verify content, code, tests, and build
        run: pnpm verify
        env:
          EXPLICO_LATEX_CACHE: .cache/explico-latex
