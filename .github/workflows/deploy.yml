name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 24.20.0
          package-manager: pnpm@11.24.0
          # withastro/action runs the package.json "build" script when present,
          # i.e. `pnpm validate:content && astro check && astro build`.
        env:
          # Serve under danieltuzes.github.io/equations/. The only place the
          # base path is set; local dev, `pnpm verify`, and e2e build at `/`.
          SITE_BASE: /equations

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
