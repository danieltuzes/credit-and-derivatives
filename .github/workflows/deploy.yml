name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the deploy job below elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 24.20.0
          package-manager: pnpm@11.24.0
          # withastro/action runs the package.json "build" script when present,
          # i.e. `pnpm validate:content && astro check && astro build`.
        env:
          # Serve under danieltuzes.github.io/credit-and-derivatives/. The only
          # place the base path is set; local dev, `pnpm verify`, and e2e build
          # at `/`.
          SITE_BASE: /credit-and-derivatives

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
